<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12263a;--mute:#64788a;--line:#d5dfe6;--ok:#1f7a5c;--over:#c2410c;--track:#dde7ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#16262f;--ink:#e8f0f5;--mute:#8aa0b0;--line:#26394a;--ok:#4cc79a;--over:#fb923c;--track:#22343f}}
:root[data-theme="dark"]{--bg:#0e1a24;--card:#16262f;--ink:#e8f0f5;--mute:#8aa0b0;--line:#26394a;--ok:#4cc79a;--over:#fb923c;--track:#22343f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big small{font-size:22px;font-weight:400;color:var(--mute);letter-spacing:0}
.bar{height:14px;border-radius:7px;background:var(--track);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:7px;transition:width .35s}
.bar.over i{background:var(--over)}
.status{font-size:14px;color:var(--mute)}
.status.over{color:var(--over)}
.row{display:flex;gap:8px;align-items:center}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--ink);color:var(--bg);padding:10px 14px;font-weight:600;white-space:nowrap}
.ghost{background:transparent;color:var(--mute);padding:6px 10px;border:1px solid var(--line)}
h2{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food b{flex:1;font-weight:600}
.food span{color:var(--mute);font-size:14px}
.plus{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;font-size:26px;line-height:1;font-weight:600;flex:none}
.plus:active{transform:scale(.92)}
.minus{width:32px;height:32px;border-radius:50%;background:var(--track);color:var(--ink);font-size:18px;flex:none}
.cnt{min-width:28px;text-align:center;font-weight:600}
.empty{color:var(--mute);font-size:14px;margin:0}
.edit{display:none;margin-top:12px}
.edit.on{display:block}
.edit .row{margin-bottom:8px}
.edit .kcal{max-width:110px}
.del{color:var(--over);background:transparent;padding:6px 8px;font-size:18px}
.avg{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.avg b{font-size:28px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{display:block;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;line-height:1.25}
.day span{display:block;color:inherit;font-size:12px}
.day b{display:block;font-size:16px}
.day.ok{border-color:var(--ok)}.day.over{border-color:var(--over)}
.day.sel{background:var(--ink);color:var(--bg)}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.msg{font-size:13px;margin-top:8px;min-height:18px;color:var(--ok)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top h1{margin:0}
.burger{width:44px;height:44px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:22px;line-height:1;flex:none}
.menu{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:14px}
.menu button{background:transparent;color:var(--ink);text-align:left;padding:12px;font-weight:600}
.menu button.cur{background:var(--track)}
</style>
</head>
<body>
<main>
  <header class="top">
    <button class="burger" id="burger" aria-label="Menü" aria-expanded="false" aria-controls="menu">☰</button>
    <h1 id="today"></h1>
  </header>
  <nav class="menu" id="menu" hidden>
    <button data-view="home" class="cur">Ana sayfa</button>
    <button data-view="cal">Takvim ve hedef</button>
  </nav>

  <div id="viewHome">
    <section class="card">
      <div class="big"><span id="eaten">0</span> <small>/ <span id="goalTxt">2000</span> kcal</small></div>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <h2>Hızlı ekle <button class="ghost" id="toggleEdit">Düzenle</button></h2>
      <div id="foods"></div>
      <div class="edit" id="edit">
        <div class="row">
          <input id="fname" placeholder="Ad (ör. yumurta)" aria-label="Yiyecek adı">
          <input id="fkcal" class="kcal" type="number" inputmode="numeric" min="0" placeholder="kcal" aria-label="Kalori">
        </div>
        <button class="btn" id="addFood" style="width:100%">Listeye ekle</button>
      </div>
    </section>

    <section class="card">
      <h2>Bugün yediklerim</h2>
      <div id="log"></div>
    </section>
  </div>

  <div id="viewCal" hidden>
    <section class="card">
      <h2>Günlük hedef</h2>
      <div class="row">
        <input id="goal" type="number" inputmode="numeric" min="0" placeholder="Günlük hedef (kcal)" aria-label="Günlük kalori hedefi">
        <button class="btn" id="saveGoal">Hedefi kaydet</button>
      </div>
      <div class="msg" id="goalMsg" role="status"></div>
    </section>

    <section class="card">
      <h2>Son 15 gün</h2>
      <div class="avg"><span>Günlük ortalama</span><span><b id="avg">–</b> kcal</span></div>
      <div class="status" id="avgNote" style="margin:-6px 0 12px"></div>
      <div class="cal" id="cal"></div>
    </section>

    <section class="card">
      <h2 id="logTitle">Bugün yediklerim</h2>
      <div id="log2"></div>
    </section>

    <section class="card">
      <h2>Yedek</h2>
      <div class="row">
        <button class="btn" id="exp" style="flex:1">Cihaza kaydet</button>
        <button class="btn" id="imp" style="flex:1">Yedekten yükle</button>
      </div>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <div class="msg" id="msg" role="status"></div>
      <p class="hint">Dosya cihazına .json olarak iner (iPhone'da Dosyalar'a kaydedebilirsin). Telefonu değiştirirsen veya verileri silersen buradan geri yükleyebilirsin.</p>
    </section>
  </div>
</main>

<script>
const KEY = "kalori-takibi-v1";
let state = { goal: 2000, foods: [], log: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") state = Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const keyOf = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const dayKey = () => keyOf(new Date());
const last15 = () => { const a = []; for (let i = 14; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); a.push(keyOf(d)); } return a; };
let sel = null;
const selKey = () => (sel && last15().includes(sel)) ? sel : dayKey();
function prune(){ const keep = last15(); Object.keys(state.log).forEach(k => { if (!keep.includes(k)) delete state.log[k]; }); save(); }
const todayLog = () => (state.log[dayKey()] = state.log[dayKey()] || []);

function add(name, kcal){ todayLog().push({ name, kcal }); save(); render(); }
function remove(name, kcal){
  const l = todayLog();
  for (let i = l.length - 1; i >= 0; i--) if (l[i].name === name && l[i].kcal === kcal) { l.splice(i, 1); break; }
  save(); render();
}

function renderCal(){
  const goal = Number(state.goal) || 0, c = $("cal"); c.innerHTML = "";
  let sum = 0, n = 0;
  last15().forEach(k => {
    const t = (state.log[k] || []).reduce((a, e) => a + e.kcal, 0);
    if (t > 0) { sum += t; n++; }
    const d = new Date(k + "T12:00:00");
    const b = document.createElement("button");
    b.className = "day" + (t > 0 ? (goal && t > goal ? " over" : " ok") : "") + (k === selKey() ? " sel" : "");
    const w = document.createElement("span"); w.textContent = k === dayKey() ? "Bugün" : d.toLocaleDateString("tr-TR", { weekday: "short" });
    const num = document.createElement("b"); num.textContent = d.getDate();
    const kc = document.createElement("span"); kc.textContent = t > 0 ? t : "–";
    b.append(w, num, kc);
    b.setAttribute("aria-label", d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" }) + ", " + t + " kcal");
    b.onclick = () => { sel = k; render(); };
    c.appendChild(b);
  });
  $("avg").textContent = n ? Math.round(sum / n) : "–";
  $("avgNote").textContent = n ? "kayıt tutulan " + n + " gün üzerinden" : "henüz kayıt yok";
}

function render(){
  prune(); renderCal();
  $("today").textContent = new Date().toLocaleDateString("tr-TR", { weekday:"long", day:"numeric", month:"long" });
  const total = todayLog().reduce((a, e) => a + e.kcal, 0), goal = Number(state.goal) || 0;
  $("eaten").textContent = total; $("goalTxt").textContent = goal;
  const pct = goal ? Math.min(100, total / goal * 100) : 0;
  $("fill").style.width = pct + "%";
  const over = goal && total > goal;
  $("bar").classList.toggle("over", !!over);
  $("status").classList.toggle("over", !!over);
  $("status").textContent = !goal ? "Menüden “Takvim ve hedef”e girip günlük hedefini belirle." : over ? (total - goal) + " kcal hedefi aştın" : "%" + Math.round(pct) + " doldu, " + (goal - total) + " kcal kaldı";

  const f = $("foods"); f.innerHTML = "";
  if (!state.foods.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "Henüz yiyecek yok. “Düzenle”ye basıp ad ve kalori ekle."; f.appendChild(p); }
  state.foods.forEach((x, i) => {
    const r = document.createElement("div"); r.className = "food";
    const b = document.createElement("b"); b.textContent = x.name;
    const s = document.createElement("span"); s.textContent = x.kcal + " kcal";
    const p = document.createElement("button"); p.className = "plus"; p.textContent = "+"; p.setAttribute("aria-label", x.name + " ekle");
    p.onclick = () => add(x.name, x.kcal);
    r.append(b, s);
    if ($("edit").classList.contains("on")) {
      const d = document.createElement("button"); d.className = "del"; d.textContent = "✕"; d.setAttribute("aria-label", x.name + " sil");
      d.onclick = () => { state.foods.splice(i, 1); save(); render(); };
      r.appendChild(d);
    }
    r.appendChild(p); f.appendChild(r);
  });

  $("goal").placeholder = "Şu an " + goal + " kcal";
  fillLog("log", dayKey());
  const k = selKey();
  $("logTitle").textContent = k === dayKey() ? "Bugün yediklerim" : new Date(k + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" }) + " kayıtları";
  fillLog("log2", k);
}

function fillLog(id, key){
  const isToday = key === dayKey(), groups = {};
  (state.log[key] || []).forEach(e => { const k = e.name + "|" + e.kcal; (groups[k] = groups[k] || { name:e.name, kcal:e.kcal, n:0 }).n++; });
  const l = $(id); l.innerHTML = "";
  const gs = Object.values(groups);
  if (!gs.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = isToday ? "Bugün henüz bir şey eklemedin." : "Bu güne ait kayıt yok."; l.appendChild(p); }
  gs.forEach(g => {
    const r = document.createElement("div"); r.className = "food";
    const b = document.createElement("b"); b.textContent = g.name + " × " + g.n;
    const s = document.createElement("span"); s.textContent = g.n * g.kcal + " kcal";
    const m = document.createElement("button"); m.className = "minus"; m.textContent = "−"; m.setAttribute("aria-label", g.name + " bir azalt");
    m.onclick = () => remove(g.name, g.kcal);
    r.append(b, s); if (isToday) r.append(m); l.appendChild(r);
  });
}

$("saveGoal").onclick = () => { const v = Number($("goal").value); if (v > 0) { state.goal = v; save(); $("goal").value = ""; render(); $("goalMsg").textContent = "Hedef güncellendi: " + v + " kcal"; } };
$("toggleEdit").onclick = () => { const e = $("edit"); e.classList.toggle("on"); $("toggleEdit").textContent = e.classList.contains("on") ? "Bitti" : "Düzenle"; render(); };
$("addFood").onclick = () => {
  const name = $("fname").value.trim(), kcal = Number($("fkcal").value);
  if (!name || !(kcal >= 0) || $("fkcal").value === "") return;
  state.foods.push({ name, kcal }); save();
  $("fname").value = ""; $("fkcal").value = ""; $("fname").focus(); render();
};
function show(v){
  $("viewHome").hidden = v !== "home"; $("viewCal").hidden = v !== "cal";
  $("menu").hidden = true; $("burger").setAttribute("aria-expanded", "false");
  document.querySelectorAll("#menu button").forEach(b => b.classList.toggle("cur", b.dataset.view === v));
  window.scrollTo(0, 0);
}
$("burger").onclick = () => { const open = $("menu").hidden; $("menu").hidden = !open; $("burger").setAttribute("aria-expanded", String(open)); };
document.querySelectorAll("#menu button").forEach(b => b.onclick = () => show(b.dataset.view));
const say = t => { $("msg").textContent = t; };
$("exp").onclick = async () => {
  const text = JSON.stringify({ app: "kalori-takibi", version: 1, exportedAt: new Date().toISOString(), goal: state.goal, foods: state.foods, log: state.log }, null, 2);
  const filename = "kalori-yedek-" + dayKey() + ".json";
  try {
    if (typeof claude !== "undefined" && claude.use) {
      const dl = await claude.use("downloads");
      if (dl) { await dl.save({ filename, data: text }); say("Kaydedildi."); return; }
    }
  } catch (e) { if (e && e.code === "declined") return; }
  try {
    const file = new File([text], filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); say("Paylaşım menüsünden “Dosyalar'a Kaydet”i seç."); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); say("Dosya indirildi.");
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "kalori-takibi" || typeof d.log !== "object") throw 0;
    if (Number(d.goal) > 0) state.goal = Number(d.goal);
    (d.foods || []).forEach(x => { if (x && x.name && Number(x.kcal) >= 0 && !state.foods.some(y => y.name === x.name && y.kcal === Number(x.kcal))) state.foods.push({ name: String(x.name), kcal: Number(x.kcal) }); });
    Object.keys(d.log).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(d.log[k])) state.log[k] = d.log[k].filter(x => x && x.name && Number(x.kcal) >= 0).map(x => ({ name: String(x.name), kcal: Number(x.kcal) })); });
    save(); render(); say("Yedek yüklendi (son 15 güne ait kayıtlar tutulur).");
  } catch (err) { say("Bu dosya geçerli bir yedek değil."); }
};
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
render();
function schedule(){ const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 1); setTimeout(() => { sel = null; render(); schedule(); }, next - n); }
schedule();
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
